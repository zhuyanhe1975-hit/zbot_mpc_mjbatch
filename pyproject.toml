[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zbot-mpc-mjbatch"
version = "0.1.0"
description = "Contact-aware variable-cadence stepping experiments for ZBot with mjbatch"
requires-python = ">=3.10"
dependencies = ["mjbatch", "mujoco==3.11.0", "numpy"]

[project.scripts]
zbot-mpc-smoke = "zbot_mpc_mjbatch.smoke:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
mjbatch = { path = "../../AI/mjbatch", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zbot_mpc_mjbatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
