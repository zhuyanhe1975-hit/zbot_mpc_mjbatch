[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zbot-mpc-mjbatch"
version = "0.1.0"
description = "Contact-aware variable-cadence stepping experiments for ZBot with mjbatch"
requires-python = ">=3.10"
dependencies = ["mjbatch", "mujoco==3.11.0", "numpy"]

[project.scripts]
zbot-mpc-smoke = "zbot_mpc_mjbatch.smoke:main"
zbot-mpc-step = "zbot_mpc_mjbatch.stepping:main"
zbot-mpc-visualize = "zbot_mpc_mjbatch.visualize:main"
zbot-mpc-train-warmstart = "zbot_mpc_mjbatch.train_warmstart:main"
zbot-mpc-periodic = "zbot_mpc_mjbatch.periodic:main"
zbot-mpc-single-leg = "zbot_mpc_mjbatch.single_leg:main"
zbot-mpc-single-leg-viewer = "zbot_mpc_mjbatch.single_leg_viewer:main"
zbot-mpc-double-leg = "zbot_mpc_mjbatch.double_leg:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
mjbatch = { path = "../../AI/mjbatch", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zbot_mpc_mjbatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
